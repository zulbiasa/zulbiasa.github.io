<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <meta content="description" name="description">
  <meta name="google" content="notranslate" />
  <title>Logbook Filler</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <style>
    :root {
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111
    }

    .wrap {
      max-width: 800px;
      margin: 20px auto;
      padding: 16px
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px
    }

    label {
      display: block;
      margin-top: 8px;
      font-weight: 500
    }

    input,
    textarea,
    select {
      font-size: 14px;
      padding: 6px;
      width: 98%;
      border: 1px solid #bbb;
      border-radius: 4px
    }

    textarea {
      min-height: 40px
    }

    button {
      background: #0b5fff;
      color: white;
      border: 0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer
    }

    button.secondary {
      background: #6b7280
    }

    button.ghost {
      background: transparent;
      color: #0b5fff;
      border: 1px solid #0b5fff
    }

    .time-entry {
      border: 1px solid #ddd;
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px
    }

    .day-tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0 12px;
      flex-wrap: wrap;
    }

    .day-tabs button {
      background: white;
      color: #111;
      border: 1px solid #bbb;
    }

    .day-tabs button[aria-selected="true"] {
      background: #0b5fff;
      color: white;
      border-color: #0b5fff;
    }

    .day-panel {
      display: none;
    }

    .day-panel.active {
      display: block;
    }

    /* Layout Side-by-Side untuk Masa */
    .time-range-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .time-range-group input[type="time"] {
      flex: 1;
      width: auto;
      min-width: 0;
    }

    .time-range-group span {
      font-weight: bold;
      color: #555;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      text-align: center
    }

    /* simple modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal .card {
      background: white;
      padding: 16px;
      width: 420px;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 6px
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Daily Training Log Generator</h1>

    <label for="logMode">Logbook period</label>
    <select id="logMode" style="width:auto">
      <option value="daily">Daily</option>
      <option value="week">For a week</option>
    </select>
    <label for="dayCount" id="dayCountLabel" hidden>Days this week</label>
    <select id="dayCount" style="width:auto" hidden>
      <option value="5">5 days</option>
      <option value="6">6 days</option>
    </select>
    <label>Training Week</label>
    <input type="text" id="field_week" placeholder="Week">

    <div id="dayTabs" class="day-tabs" role="tablist" aria-label="Logbook days"></div>
    <div id="dayForms"></div>
    <p class="small">Maximum 8 time entries per day.</p>

    <h3>Signature</h3>
    <canvas id="signature-pad" width="250" height="150"
      style="border:1px solid #ccc; width:250px; height:150px; background:white; border-radius:8px;">
    </canvas>

    <div style="margin-top:10px;">
      <button id="clearSig" class="secondary">Clear Signature</button>
      <!-- Pilihan susunan teks baharu -->
      <label for="descAlignment" style="margin-right: 8px;"> Format Alignment:</label>
      <select id="descAlignment" style="width: auto; padding: 7px; margin-right: 8px;">
        <option value="justify">Justify</option>
        <option value="left">Left</option>
      </select>
    </div>

    <div class="controls" style="align-items: center;">
      <!--<button id="aiFillBtn" class="ghost">AI Fill (suggest entries)</button>-->


      <button id="downloadBtn">Download filled PDF</button>

    </div>

    <footer>© 2025 Zulhelmi Afendi All right reserved</footer>
  </div>

  <!-- AI Prompt Modal -->
  <div id="aiModal" class="modal">
    <div class="card">
      <h3 style="margin:0 0 8px 0">AI Autofill</h3>
      <label>Short prompt (e.g. "research, meeting, coding"): <small class="small">optional — AI will infer from date if
          blank</small></label>
      <input id="aiPrompt" placeholder="e.g. worked on prototype, meeting with supervisor, testing">
      <label>Max entries (1-8)</label>
      <input id="aiCount" type="number" min="1" max="8" value="3">
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;">
        <button id="aiCancel" class="secondary">Cancel</button>
        <button id="aiGenerate">Generate</button>
      </div>
      <div id="aiStatus" class="small" style="margin-top:8px;display:none"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script>
    // === Signature Pad Setup ===
    const canvas = document.getElementById("signature-pad");

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = 250 * ratio;
      canvas.height = 150 * ratio;
      canvas.style.width = '250px';
      canvas.style.height = '150px';
      canvas.getContext("2d").scale(ratio, ratio);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    const signaturePad = new SignaturePad(canvas);
    document.getElementById("clearSig").addEventListener("click", () => signaturePad.clear());

    // === Field map & entry UI ===
    const FIELD_MAP = {
      field_day: { x: 290, y: 760, size: 10 },
      field_week: { x: 490, y: 760, size: 10 },
      field_date: { x: 130, y: 760, size: 10 },
      field_date2: { x: 110, y: 89, size: 10 }
    };

    const dayCountSelect = document.getElementById('dayCount');
    const logModeSelect = document.getElementById('logMode');
    const dayCountLabel = document.getElementById('dayCountLabel');
    const dayTabs = document.getElementById('dayTabs');
    const dayForms = document.getElementById('dayForms');
    const dayStates = [];
    let activeDayIndex = 0;

    function createTimeEntry(dayIndex) {
      const day = dayStates[dayIndex];
      const entryIndex = ++day.entryCount;
      const div = document.createElement('div');
      div.className = 'time-entry';
      div.dataset.index = entryIndex;
      div.innerHTML = `
        <label>Time (Start - End [Optional])</label>
        <div class="time-range-group">
          <input type="time" id="day_${dayIndex}_t_start_${entryIndex}" step="60">
          <span>-</span>
          <input type="time" id="day_${dayIndex}_t_end_${entryIndex}" step="60">
        </div>
        <label>Entry</label>
        <input type="text" id="day_${dayIndex}_e${entryIndex}" placeholder="Entry title">
        <label>Description</label>
        <textarea id="day_${dayIndex}_d${entryIndex}" placeholder="Description"></textarea>
        <label>Image (Optional)</label>
        <input type="file" id="day_${dayIndex}_img_${entryIndex}" accept="image/png, image/jpeg">
      `;
      day.entriesDiv.appendChild(div);
    }

    function setDayName(dayIndex) {
      const dateVal = document.getElementById(`day_date_${dayIndex}`).value;
      const dayNameField = document.getElementById(`day_name_${dayIndex}`);
      if (!dateVal) {
        dayNameField.value = '';
        return;
      }
      const d = new Date(dateVal + 'T00:00:00');
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      dayNameField.value = days[d.getDay()];
    }

    function setDateFromStart(dayIndex, startDate) {
      if (!startDate) return '';
      const date = new Date(`${startDate}T00:00:00`);
      date.setDate(date.getDate() + dayIndex);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function selectDay(dayIndex) {
      activeDayIndex = dayIndex;
      dayTabs.querySelectorAll('button').forEach((tab, index) => {
        tab.setAttribute('aria-selected', String(index === dayIndex));
      });
      dayForms.querySelectorAll('.day-panel').forEach((panel, index) => {
        panel.classList.toggle('active', index === dayIndex);
      });
    }

    for (let dayIndex = 0; dayIndex < 6; dayIndex++) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', 'false');
      tab.textContent = `Day ${dayIndex + 1}`;
      tab.addEventListener('click', () => selectDay(dayIndex));
      dayTabs.appendChild(tab);

      const panel = document.createElement('section');
      panel.className = 'day-panel';
      panel.setAttribute('role', 'tabpanel');
      panel.innerHTML = `
        <h3>Day ${dayIndex + 1}</h3>
        <label for="day_date_${dayIndex}">Date</label>
        <input type="date" id="day_date_${dayIndex}">
        <label for="day_name_${dayIndex}">Day</label>
        <input type="text" id="day_name_${dayIndex}" readonly>
        <div id="day_entries_${dayIndex}"></div>
        <button type="button" id="add_entry_${dayIndex}">+ Add Time Entry</button>
      `;
      dayForms.appendChild(panel);

      const day = { entryCount: 0, entriesDiv: panel.querySelector(`#day_entries_${dayIndex}`) };
      dayStates.push(day);
      for (let entry = 0; entry < 3; entry++) createTimeEntry(dayIndex);
      panel.querySelector(`#add_entry_${dayIndex}`).addEventListener('click', () => {
        if (day.entryCount < 8) createTimeEntry(dayIndex);
        else alert('Maximum 8 entries allowed per day');
      });
      panel.querySelector(`#day_date_${dayIndex}`).addEventListener('change', () => {
        setDayName(dayIndex);
        if (dayIndex === 0) {
          for (let nextDay = 1; nextDay < 6; nextDay++) {
            document.getElementById(`day_date_${nextDay}`).value = setDateFromStart(nextDay, panel.querySelector(`#day_date_${dayIndex}`).value);
            setDayName(nextDay);
          }
        }
      });
    }

    function updateDayMode() {
      const isWeekly = logModeSelect.value === 'week';
      const dayCount = isWeekly ? Number(dayCountSelect.value) : 1;
      dayCountSelect.hidden = !isWeekly;
      dayCountLabel.hidden = !isWeekly;
      dayTabs.querySelectorAll('button').forEach((tab, index) => { tab.hidden = index >= dayCount; });
      dayForms.querySelectorAll('.day-panel').forEach((panel, index) => { panel.hidden = index >= dayCount; });
      if (activeDayIndex >= dayCount) selectDay(0);
    }

    dayCountSelect.addEventListener('change', updateDayMode);
    logModeSelect.addEventListener('change', updateDayMode);
    dayCountSelect.dispatchEvent(new Event('change'));
    selectDay(0);

    // === Helper Membaca Fail Gambar ===
    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    // === Helper Embed Gambar ke PDF (Dua Format) ===
    async function embedUploadedImage(pdfDoc, file) {
      const buffer = await readFileAsArrayBuffer(file);
      try {
        if (file.type === 'image/png') {
          return await pdfDoc.embedPng(buffer);
        } else {
          return await pdfDoc.embedJpg(buffer);
        }
      } catch (e) {
        try {
          return await pdfDoc.embedPng(buffer);
        } catch (e2) {
          return await pdfDoc.embedJpg(buffer);
        }
      }
    }

    // === Drawing text into PDF helpers ===
    function wrapTextPrecise(text, maxWidth, fontSize, font) {
      const paragraphs = text.split('\n');
      let allLines = [];

      for (const paragraph of paragraphs) {
        // Mendeteksi jika kalimat diawali dengan bullet point (- atau * atau •)
        const isBullet = /^[-*•]\s+/.test(paragraph);
        let bulletIndent = 0;

        if (isBullet) {
          const bulletPrefix = paragraph.match(/^[-*•]\s+/)[0];
          bulletIndent = font.widthOfTextAtSize(bulletPrefix, fontSize);
        }

        const words = paragraph.split(' ');
        let currentLine = '';
        let isFirstLineOfParagraph = true;

        for (let i = 0; i < words.length; i++) {
          const word = words[i];
          const testLine = currentLine.length > 0 ? currentLine + ' ' + word : word;

          // Kurangi jatah ruang maksimal untuk baris lanjutan (agar teks sejajar akibat lekukan/indent)
          const currentMaxWidth = (isBullet && !isFirstLineOfParagraph) ? maxWidth - bulletIndent : maxWidth;

          if (font.widthOfTextAtSize(testLine, fontSize) > currentMaxWidth && currentLine.length > 0) {
            allLines.push({
              text: currentLine,
              indent: isFirstLineOfParagraph ? 0 : (isBullet ? bulletIndent : 0),
              isLastLine: false
            });
            currentLine = word;
            isFirstLineOfParagraph = false;
          } else {
            currentLine = testLine;
          }
        }

        if (currentLine) {
          allLines.push({
            text: currentLine,
            indent: isFirstLineOfParagraph ? 0 : (isBullet ? bulletIndent : 0),
            isLastLine: true
          });
        }
      }
      return allLines;
    }

    function drawLines(page, x, y, lines, size = 10, align = 'left', font = null, maxWidth = 160) {
      let currentY = y;
      const lineHeight = size + 4;

      for (let i = 0; i < lines.length; i++) {
        // Mendukung objek garis dari wrapTextPrecise atau string biasa
        const lineObj = typeof lines[i] === 'string' ? { text: lines[i], indent: 0, isLastLine: true } : lines[i];
        const textToDraw = lineObj.text;
        let drawX = x + (lineObj.indent || 0);

        if (align === 'center' && font) {
          const textWidth = font.widthOfTextAtSize(textToDraw, size);
          drawX = x + (maxWidth - textWidth) / 2;
        }
        // Logika baharu untuk JUSTIFY (Rata Kiri-Kanan)
        else if (align === 'justify' && font && !lineObj.isLastLine) {
          const words = textToDraw.split(' ');
          if (words.length > 1) {
            const effectiveMaxWidth = maxWidth - (lineObj.indent || 0);
            const totalWordsWidth = words.reduce((sum, w) => sum + font.widthOfTextAtSize(w, size), 0);
            const spaceWidth = (effectiveMaxWidth - totalWordsWidth) / (words.length - 1);

            let wordX = drawX;
            for (const word of words) {
              page.drawText(word, { x: wordX, y: currentY, size, font });
              wordX += font.widthOfTextAtSize(word, size) + spaceWidth;
            }
            currentY -= lineHeight;
            continue; // Lompat/selesai menggambar baris ini, lanjut ke baris berikutnya
          }
        }

        // Lukisan standard (Kiri, Tengah, atau baris terakhir paragraf yang tidak boleh di-justify)
        page.drawText(textToDraw, { x: drawX, y: currentY, size, font: font || undefined });
        currentY -= lineHeight;
      }
    }

    function getVal(id) { return document.getElementById(id)?.value || ''; }
    function formatDate(val) { if (!val) return ''; const d = new Date(val + 'T00:00:00'); return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear(); }

    function formatTime(timeStr) {
      if (!timeStr) return '';
      let [h, m] = timeStr.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    function formatTimeRange(startStr, endStr) {
      const startFormatted = formatTime(startStr);
      const endFormatted = formatTime(endStr);

      if (startFormatted && endFormatted) {
        return `${startFormatted}\n- ${endFormatted}`;
      } else if (startFormatted) {
        return startFormatted;
      } else if (endFormatted) {
        return endFormatted;
      }
      return '';
    }

    function drawHeaders(page, vals) {
      if (vals.field_date) drawLines(page, FIELD_MAP.field_date.x, FIELD_MAP.field_date.y, [vals.field_date], FIELD_MAP.field_date.size);
      if (vals.field_day) drawLines(page, FIELD_MAP.field_day.x, FIELD_MAP.field_day.y, [vals.field_day], FIELD_MAP.field_day.size);
      if (vals.field_week) drawLines(page, FIELD_MAP.field_week.x, FIELD_MAP.field_week.y, [vals.field_week], FIELD_MAP.field_week.size);
    }

    // === Download PDF ===
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      try {
        const templateUrl = 'assets/documents/logbook_template.pdf';
        const resp = await fetch(templateUrl);
        const alignSetting = document.getElementById('descAlignment').value;

        if (!resp.ok) {
          throw new Error(`Fail template PDF tidak dijumpai di laluan: "${templateUrl}". Sila pastikan fail tersebut wujud.`);
        }

        const bytes = await resp.arrayBuffer();

        // 1. Kekalkan 'templateDoc' yang sentiasa bersih
        const templateDoc = await PDFLib.PDFDocument.load(bytes);

        // 2. Cipta dokumen baharu
        const pdfDoc = await PDFLib.PDFDocument.create();

        const helveticaFont = await pdfDoc.embedStandardFont(PDFLib.StandardFonts.Helvetica);
        const PAGE_BOTTOM_LIMIT = 200;
        const dayCount = logModeSelect.value === 'week' ? Number(dayCountSelect.value) : 1;

        for (let dayIndex = 0; dayIndex < dayCount; dayIndex++) {
          const dateValue = getVal(`day_date_${dayIndex}`);
          const vals = {
            field_day: getVal(`day_name_${dayIndex}`),
            field_week: getVal('field_week'),
            field_date: formatDate(dateValue),
            field_date2: formatDate(dateValue)
          };
          const dayPages = [];

          async function addCleanPage() {
            const [cleanPage] = await pdfDoc.copyPages(templateDoc, [0]);
            const newPage = pdfDoc.addPage(cleanPage);
            drawHeaders(newPage, vals);
            dayPages.push(newPage);
            return newPage;
          }

          let currentPage = await addCleanPage();
          let currentY = 700;
          const day = dayStates[dayIndex];

          for (let entryIndex = 1; entryIndex <= day.entryCount; entryIndex++) {
            const startTime = getVal(`day_${dayIndex}_t_start_${entryIndex}`);
            const endTime = getVal(`day_${dayIndex}_t_end_${entryIndex}`);
            const timeText = formatTimeRange(startTime, endTime);
            const entryText = getVal(`day_${dayIndex}_e${entryIndex}`);
            const descText = getVal(`day_${dayIndex}_d${entryIndex}`);
            const imgInput = document.getElementById(`day_${dayIndex}_img_${entryIndex}`);
            const imageFile = imgInput?.files?.[0];

            if (!startTime && !endTime && !entryText.trim() && !descText.trim() && !imageFile) continue;

            const timeLines = timeText ? wrapTextPrecise(timeText, 180, 9, helveticaFont) : [];
            const entryLines = entryText ? wrapTextPrecise(entryText, 160, 10, helveticaFont) : [];
            const descLines = descText ? wrapTextPrecise(descText, 160, 10, helveticaFont) : [];
            const timeH = timeLines.length * 13;
            const entryH = entryLines.length * 14;
            const descH = descLines.length * 14;

            let embeddedImg = null;
            let imgDims = null;
            let imgH = 0;

            if (imageFile) {
              try {
                embeddedImg = await embedUploadedImage(pdfDoc, imageFile);
                imgDims = embeddedImg.scaleToFit(180, 100);
                imgH = imgDims.height + 10;
              } catch (err) {
                console.error(`Error loading image for day ${dayIndex + 1}, entry ${entryIndex}:`, err);
              }
            }

            const entryTotalHeight = Math.max(timeH, entryH, descH + imgH, 45);
            if (currentY - entryTotalHeight < PAGE_BOTTOM_LIMIT) {
              currentPage = await addCleanPage();
              currentY = 700;
            }

            if (timeLines.length) drawLines(currentPage, 67, currentY, timeLines, 9, 'center', helveticaFont, 70);
            if (entryLines.length) drawLines(currentPage, 140, currentY, entryLines, 10, alignSetting, helveticaFont, 177);
            if (descLines.length) drawLines(currentPage, 335, currentY, descLines, 10, alignSetting, helveticaFont, 177);

            if (embeddedImg && imgDims) {
              const imgY = currentY - descH - imgDims.height - 5;
              currentPage.drawImage(embeddedImg, {
                x: 335,
                y: imgY,
                width: imgDims.width,
                height: imgDims.height,
              });
            }

            currentY -= (entryTotalHeight + 15);
          }

          if (vals.field_date2) {
            for (const page of dayPages) {
              drawLines(page, FIELD_MAP.field_date2.x, FIELD_MAP.field_date2.y, [vals.field_date2], FIELD_MAP.field_date2.size);
            }
          }
        }

        let sigImage = null;
        if (!signaturePad.isEmpty()) {
          const dataURL = signaturePad.toDataURL("image/png");
          const sigImageBytes = await fetch(dataURL).then(r => r.arrayBuffer());
          sigImage = await pdfDoc.embedPng(sigImageBytes);
        }

        const allPages = pdfDoc.getPages();
        for (const page of allPages) {
          if (sigImage) {
            page.drawImage(sigImage, { x: 100, y: 100, width: 100, height: 70 });
          }
        }

        const out = await pdfDoc.save();
        const blob = new Blob([out], { type: 'application/pdf' });
        const firstDate = formatDate(getVal('day_date_0')).replace(/\//g, '-') || 'UNSET';
        const weekNumber = getVal('field_week').trim().match(/\d+/)?.[0] || 'UNSET';
        const name = logModeSelect.value === 'week'
          ? `LOGBOOK_WEEK_${weekNumber}.pdf`
          : `LOGBOOK_${firstDate}.pdf`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
      } catch (e) {
        alert('Error generating PDF: ' + (e.message || e));
      }
    });

    // === AI modal logic ===
    const aiModal = document.getElementById('aiModal');
    const aiFillBtn = document.getElementById('aiFillBtn');
    const aiCancel = document.getElementById('aiCancel');
    const aiGenerate = document.getElementById('aiGenerate');
    const aiStatus = document.getElementById('aiStatus');

    if (aiFillBtn) {
      aiFillBtn.addEventListener('click', () => {
        aiStatus.style.display = 'none';
        document.getElementById('aiPrompt').value = '';
        document.getElementById('aiCount').value = Math.min(3, 8);
        aiModal.style.display = 'flex';
      });
    }
    aiCancel.addEventListener('click', () => aiModal.style.display = 'none');

    // function to populate UI entries from AI result
    function applyAIEntries(entries) {
      const day = dayStates[activeDayIndex];
      day.entriesDiv.innerHTML = '';
      day.entryCount = 0;
      const max = Math.min(8, entries.length);
      for (let i = 0; i < max; i++) {
        createTimeEntry(activeDayIndex);
        const idx = i + 1;
        const e = entries[i];

        if (e.start_time) document.getElementById(`day_${activeDayIndex}_t_start_${idx}`).value = e.start_time;
        if (e.end_time) document.getElementById(`day_${activeDayIndex}_t_end_${idx}`).value = e.end_time;
        if (e.time && !e.start_time) {
          const times = e.time.split('-').map(t => t.trim());
          if (times[0]) document.getElementById(`day_${activeDayIndex}_t_start_${idx}`).value = times[0];
          if (times[1]) document.getElementById(`day_${activeDayIndex}_t_end_${idx}`).value = times[1];
        }

        if (e.title) document.getElementById(`day_${activeDayIndex}_e${idx}`).value = e.title;
        if (e.description) document.getElementById(`day_${activeDayIndex}_d${idx}`).value = e.description;
      }
    }

    aiGenerate.addEventListener('click', async () => {
      const prompt = document.getElementById('aiPrompt').value.trim();
      let count = parseInt(document.getElementById('aiCount').value) || 3;
      count = Math.max(1, Math.min(8, count));
      const date = getVal(`day_date_${activeDayIndex}`);

      aiStatus.style.display = 'block';
      aiStatus.textContent = 'Generating suggestions...';

      try {
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, count, date })
        });
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error('Server error: ' + text);
        }
        const json = await resp.json();
        if (json?.entries && Array.isArray(json.entries) && json.entries.length) {
          applyAIEntries(json.entries);
          aiStatus.textContent = 'Done — entries populated.';
        } else {
          throw new Error('AI returned no entries.');
        }
      } catch (err) {
        aiStatus.textContent = 'Error: ' + (err.message || err);
      } finally {
        setTimeout(() => { aiModal.style.display = 'none'; aiStatus.style.display = 'none'; }, 1200);
      }
    });

    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') aiModal.style.display = 'none'; });

  </script>
</body>

</html>
